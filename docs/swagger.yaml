basePath: /api/v1
definitions:
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/domain.User'
    type: object
  content.ListRecordsResult:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Record'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  domain.AccessControl:
    properties:
      allowed_roles:
        items:
          type: string
        type: array
      crud_policy:
        $ref: '#/definitions/domain.CRUDPolicy'
      is_public:
        type: boolean
    type: object
  domain.ArrayConfig:
    properties:
      max_items:
        type: integer
      min_items:
        type: integer
      unique_items:
        type: boolean
    type: object
  domain.CRUDPolicy:
    properties:
      create:
        items:
          type: string
        type: array
      delete:
        items:
          type: string
        type: array
      read:
        items:
          type: string
        type: array
      update:
        items:
          type: string
        type: array
    type: object
  domain.Collection:
    properties:
      access:
        $ref: '#/definitions/domain.AccessControl'
      description:
        type: string
      fields:
        items:
          $ref: '#/definitions/domain.Field'
        type: array
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    required:
    - fields
    - name
    - slug
    type: object
  domain.Condition:
    properties:
      equals: {}
      field:
        type: string
    type: object
  domain.ConditionalLogic:
    properties:
      show_if:
        $ref: '#/definitions/domain.Condition'
    type: object
  domain.Field:
    properties:
      array_config:
        $ref: '#/definitions/domain.ArrayConfig'
      computed_by:
        type: string
      default_value: {}
      description:
        type: string
      fields:
        items:
          $ref: '#/definitions/domain.Field'
        type: array
      internal:
        description: Strip from API responses for anonymous access to public collections
        type: boolean
      is_array:
        description: Array Configuration
        type: boolean
      key:
        type: string
      label:
        type: string
      logic:
        $ref: '#/definitions/domain.ConditionalLogic'
      options:
        items:
          $ref: '#/definitions/domain.Option'
        type: array
      placeholder:
        type: string
      props:
        additionalProperties: true
        description: Additional dynamic properties for specific components
        type: object
      relation:
        allOf:
        - $ref: '#/definitions/domain.RelationConfig'
        description: Relational & Advanced Logic
      required:
        type: boolean
      searchable:
        description: 'Query engine: include field in full-text-style search across
          records'
        type: boolean
      type:
        $ref: '#/definitions/domain.FieldType'
      unique:
        type: boolean
      validation:
        $ref: '#/definitions/domain.ValidationRules'
    required:
    - key
    - type
    type: object
  domain.FieldType:
    enum:
    - text
    - textarea
    - number
    - email
    - password
    - phone
    - url
    - select
    - radio
    - checkbox
    - multiselect
    - datepicker
    - timepicker
    - datetimepicker
    - file
    - image
    - bool
    - toggle
    - slider
    - rating
    - colorpicker
    - section
    - group
    - tabs
    - grid
    - repeater
    - relation
    - autocomplete
    - submit
    - reset
    - action
    type: string
    x-enum-comments:
      TypeBool: Simple boolean
    x-enum-descriptions:
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - Simple boolean
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    x-enum-varnames:
    - TypeTextInput
    - TypeTextArea
    - TypeNumberInput
    - TypeEmailInput
    - TypePasswordInput
    - TypePhoneInput
    - TypeURLInput
    - TypeSelect
    - TypeRadio
    - TypeCheckbox
    - TypeMultiSelect
    - TypeDatePicker
    - TypeTimePicker
    - TypeDateTimePicker
    - TypeFileUpload
    - TypeImageUpload
    - TypeBool
    - TypeToggleField
    - TypeSliderField
    - TypeRatingField
    - TypeColorPickerField
    - TypeSection
    - TypeFieldGroup
    - TypeTabs
    - TypeGrid
    - TypeRepeater
    - TypeRelation
    - TypeAutocomplete
    - TypeSubmitButton
    - TypeResetButton
    - TypeCustomAction
  domain.Option:
    properties:
      label:
        type: string
      value: {}
    type: object
  domain.Record:
    additionalProperties: true
    type: object
  domain.RelationConfig:
    properties:
      collection:
        type: string
      field:
        description: UI display field
        type: string
    type: object
  domain.User:
    properties:
      active_status:
        type: boolean
      email:
        type: string
      id:
        type: string
      is_initial_admin:
        type: boolean
      role_id:
        type: string
      username:
        type: string
    required:
    - role_id
    - username
    type: object
  domain.ValidationRules:
    properties:
      max:
        type: number
      max_length:
        type: integer
      min:
        type: number
      min_length:
        type: integer
      regex:
        type: string
    type: object
  setup.SetupRequest:
    properties:
      password:
        minLength: 8
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
host: localhost:3000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a dynamic Headless CMS API built with Go Fiber and MongoDB.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: GoHeadless CMS API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with username and password, returns a JWT token
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - auth
  /collections:
    get:
      description: Get metadata for all user-defined collections
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Collection'
            type: array
      summary: List all collections
      tags:
      - collections
    post:
      consumes:
      - application/json
      description: Define a new dynamic collection with fields
      parameters:
      - description: Collection Definition
        in: body
        name: collection
        required: true
        schema:
          $ref: '#/definitions/domain.Collection'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Collection'
      summary: Create a new collection
      tags:
      - collections
  /collections/{slug}:
    delete:
      description: Remove a collection definition by its slug
      parameters:
      - description: Collection Slug
        in: path
        name: slug
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete collection by slug
      tags:
      - collections
    get:
      description: Get metadata for a specific collection by its unique slug
      parameters:
      - description: Collection Slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Collection'
      summary: Get collection by slug
      tags:
      - collections
  /content/{collSlug}:
    get:
      description: Paginated list with search, filter[field][op], and sort (-field
        for DESC). Anonymous users on public collections receive internal fields stripped.
      parameters:
      - description: Collection Slug
        in: path
        name: collSlug
        required: true
        type: string
      - description: Page (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 10, max 100)
        in: query
        name: limit
        type: integer
      - description: Search across searchable text fields
        in: query
        name: search
        type: string
      - description: Sort field; prefix - for descending
        in: query
        name: sort
        type: string
      - description: 'Dynamic filters: filter[key]=val or filter[key][gt]=val'
        in: query
        name: filter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/content.ListRecordsResult'
      summary: List records in a collection (query engine)
      tags:
      - content
    post:
      consumes:
      - application/json
      description: Upsert dynamic content into a collection. Validates against collection
        schema.
      parameters:
      - description: Collection Slug
        in: path
        name: collSlug
        required: true
        type: string
      - description: Dynamic Record Data
        in: body
        name: record
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Create a new record
      tags:
      - content
  /content/{collSlug}/{id}:
    delete:
      description: Remove a specific dynamic record from a collection
      parameters:
      - description: Collection Slug
        in: path
        name: collSlug
        required: true
        type: string
      - description: Record ID (Hex)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete record by ID
      tags:
      - content
    get:
      description: Retrieve a specific dynamic record by its unique MongoDB ID
      parameters:
      - description: Collection Slug
        in: path
        name: collSlug
        required: true
        type: string
      - description: Record ID (Hex)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get record by ID
      tags:
      - content
    put:
      consumes:
      - application/json
      description: Modify a dynamic record. Validates update against collection schema.
      parameters:
      - description: Collection Slug
        in: path
        name: collSlug
        required: true
        type: string
      - description: Record ID (Hex)
        in: path
        name: id
        required: true
        type: string
      - description: Updated Record Data
        in: body
        name: record
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Update record by ID
      tags:
      - content
  /setup:
    post:
      consumes:
      - application/json
      description: This endpoint only works when no users exist in the system. Calling
        it after initial setup returns a 403.
      parameters:
      - description: Initial credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/setup.SetupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create the initial superadmin user
      tags:
      - setup
  /setup/status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Check if system setup is required
      tags:
      - setup
  /upload:
    delete:
      description: Deletes a file from the server's local storage based on its path.
      parameters:
      - description: The path of the file to delete (e.g. /uploads/file_name.ext)
        in: query
        name: path
        required: true
        type: string
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid path or file not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error during file deletion
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete an uploaded file
      tags:
      - Upload
    post:
      consumes:
      - multipart/form-data
      description: Handles file upload, converts images to WebP if applicable, and
        saves it to the server's local storage.
      parameters:
      - description: The file to upload
        in: formData
        name: file
        required: true
        type: file
      responses:
        "200":
          description: Returns the file path
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid file upload request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error during processing
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Upload a file
      tags:
      - Upload
    put:
      consumes:
      - multipart/form-data
      description: Deletes the old file and replaces it with a new one.
      parameters:
      - description: The path of the file to replace
        in: query
        name: oldPath
        required: true
        type: string
      - description: The new file
        in: formData
        name: file
        required: true
        type: file
      responses:
        "200":
          description: Returns the new file path
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error during processing
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Replace an uploaded file
      tags:
      - Upload
swagger: "2.0"
