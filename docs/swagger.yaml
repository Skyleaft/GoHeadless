basePath: /api/v1
definitions:
  domain.Collection:
    properties:
      description:
        type: string
      fields:
        items:
          $ref: '#/definitions/domain.Field'
        type: array
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    required:
    - fields
    - name
    - slug
    type: object
  domain.Field:
    properties:
      description:
        type: string
      name:
        type: string
      required:
        type: boolean
      type:
        allOf:
        - $ref: '#/definitions/domain.FieldType'
        enum:
        - String
        - Number
        - Float
        - DateTime
        - Bool
        - Image
      unique:
        type: boolean
    required:
    - name
    - type
    type: object
  domain.FieldType:
    enum:
    - String
    - Number
    - Float
    - DateTime
    - Bool
    - Image
    type: string
    x-enum-varnames:
    - TypeString
    - TypeNumber
    - TypeFloat
    - TypeDateTime
    - TypeBool
    - TypeImage
host: localhost:3000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a dynamic Headless CMS API built with Go Fiber and MongoDB.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: GoHeadless CMS API
  version: "1.0"
paths:
  /collections:
    get:
      description: Get metadata for all user-defined collections
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Collection'
            type: array
      summary: List all collections
      tags:
      - collections
    post:
      consumes:
      - application/json
      description: Define a new dynamic collection with fields
      parameters:
      - description: Collection Definition
        in: body
        name: collection
        required: true
        schema:
          $ref: '#/definitions/domain.Collection'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Collection'
      summary: Create a new collection
      tags:
      - collections
  /collections/{slug}:
    delete:
      description: Remove a collection definition by its slug
      parameters:
      - description: Collection Slug
        in: path
        name: slug
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete collection by slug
      tags:
      - collections
    get:
      description: Get metadata for a specific collection by its unique slug
      parameters:
      - description: Collection Slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Collection'
      summary: Get collection by slug
      tags:
      - collections
  /content/{collSlug}:
    get:
      description: Fetch all dynamic content records for the given collection slug
      parameters:
      - description: Collection Slug
        in: path
        name: collSlug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: List all records in a collection
      tags:
      - content
    post:
      consumes:
      - application/json
      description: Upsert dynamic content into a collection. Validates against collection
        schema.
      parameters:
      - description: Collection Slug
        in: path
        name: collSlug
        required: true
        type: string
      - description: Dynamic Record Data
        in: body
        name: record
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Create a new record
      tags:
      - content
  /content/{collSlug}/{id}:
    delete:
      description: Remove a specific dynamic record from a collection
      parameters:
      - description: Collection Slug
        in: path
        name: collSlug
        required: true
        type: string
      - description: Record ID (Hex)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete record by ID
      tags:
      - content
    get:
      description: Retrieve a specific dynamic record by its unique MongoDB ID
      parameters:
      - description: Collection Slug
        in: path
        name: collSlug
        required: true
        type: string
      - description: Record ID (Hex)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get record by ID
      tags:
      - content
    put:
      consumes:
      - application/json
      description: Modify a dynamic record. Validates update against collection schema.
      parameters:
      - description: Collection Slug
        in: path
        name: collSlug
        required: true
        type: string
      - description: Record ID (Hex)
        in: path
        name: id
        required: true
        type: string
      - description: Updated Record Data
        in: body
        name: record
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Update record by ID
      tags:
      - content
  /upload/image:
    post:
      consumes:
      - multipart/form-data
      description: Handles image file upload, converts it to WebP format, and saves
        it to the server's local storage.
      parameters:
      - description: The image to upload
        in: formData
        name: image
        required: true
        type: file
      responses:
        "200":
          description: Returns the image path
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid file upload request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error during image processing
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Upload and convert image to webp
      tags:
      - Upload
swagger: "2.0"
