services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: goheadless-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    networks:
      - goheadless-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Go API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goheadless-api
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongodb:27017/?authSource=admin
      DB_NAME: ${DB_NAME:-goheadless_cms}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - goheadless-network
    healthcheck:
      test: wget --spider -q http://localhost:3000/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Nginx Reverse Proxy & Static File Server
  nginx:
    build:
      context: ./Panel
      dockerfile: Dockerfile.nginx
    container_name: goheadless-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - goheadless-network

volumes:
  mongodb_data:
    driver: local
  uploads_data:
    driver: local

networks:
  goheadless-network:
    driver: bridge